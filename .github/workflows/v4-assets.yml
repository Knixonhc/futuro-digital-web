name: Futuro Digital V4 assets

on:
  push:
    paths:
      - '.github/workflows/v4-assets.yml'

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download curated local imagery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img/people assets/img/brands
          curl -L --fail --retry 3 'https://images.pexels.com/photos/5493654/pexels-photo-5493654.jpeg?auto=compress&cs=tinysrgb&w=1600' -o assets/img/people/arzana-renovation.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/7108415/pexels-photo-7108415.jpeg?auto=compress&cs=tinysrgb&w=1600' -o assets/img/people/cdeco-ultrasound.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/3861933/pexels-photo-3861933.jpeg?auto=compress&cs=tinysrgb&w=1600' -o assets/img/people/estracoach-coaching.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/6804586/pexels-photo-6804586.jpeg?auto=compress&cs=tinysrgb&w=1600' -o assets/img/people/hosting-tech.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/1181335/pexels-photo-1181335.jpeg?auto=compress&cs=tinysrgb&w=1600' -o assets/img/people/software-team.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/6592668/pexels-photo-6592668.jpeg?auto=compress&cs=tinysrgb&w=1600' -o assets/img/people/email-team.jpg
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/Knixonhc/nutri-organicos-web/main/assets/images/logo-nutri.png' -o assets/img/brands/nutri-logo.png
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/Knixonhc/nutri-organicos-web/main/assets/images/logo-nutri-blanco.png' -o assets/img/brands/nutri-logo-white.png
      - name: Document image sources
        shell: bash
        run: |
          cat > assets/img/people/SOURCES.md <<'EOF'
          # Fuentes de fotografía
          Fotografías editoriales almacenadas localmente. Pexels, uso según su licencia vigente al momento de incorporación.
          - Arzana / renovación: photo 5493654 — Antoni Shkraba
          - CDECO / ecografía: photo 7108415 — Pavel Danilyuk
          - Estracoach / coaching: photo 3861933 — Andrea Piacquadio
          - Hosting / infraestructura: photo 6804586 — cottonbro studio
          - Software / tecnología: photo 1181335 — Christina Morillo
          - Correo / colaboración: photo 6592668 — Mikhail Nilov
          EOF
      - name: Commit assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img
          git commit -m 'Añade fotografía temática y logos locales para V4'
          git push origin HEAD:main
