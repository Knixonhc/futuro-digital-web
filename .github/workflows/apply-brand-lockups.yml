name: Apply project brand lockups

on:
  push:
    paths:
      - '.github/workflows/apply-brand-lockups.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use logo assets in project cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/main.js')
          s=p.read_text()
          s=s.replace("'Arzana Reformas':{img:'assets/img/people/arzana-renovation.jpg',cls:'project-arzana',mark:'AR',label:'ARZANA REFORMAS',sub:'Reformas integrales'}", "'Arzana Reformas':{img:'assets/img/people/arzana-renovation.jpg',cls:'project-arzana',logo:'assets/img/brands/arzana-logo.svg',label:'ARZANA REFORMAS',sub:'Reformas integrales'}")
          s=s.replace("'CDECO':{img:'assets/img/people/cdeco-ultrasound.jpg',cls:'project-cdeco',mark:'CD',label:'CDECO',sub:'Salud integral'}", "'CDECO':{img:'assets/img/people/cdeco-ultrasound.jpg',cls:'project-cdeco',logo:'assets/img/brands/cdeco-logo.svg',label:'CDECO',sub:'Salud integral'}")
          s=s.replace("'Estracoach':{img:'assets/img/people/estracoach-coaching.jpg',cls:'project-estracoach',mark:'ES',label:'ESTRACOACH',sub:'Consultoría & coaching'}", "'Estracoach':{img:'assets/img/people/estracoach-coaching.jpg',cls:'project-estracoach',logo:'assets/img/brands/estracoach-logo.svg',label:'ESTRACOACH',sub:'Consultoría & coaching'}")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/main.js
          git commit -m 'Usa marcas visuales en proyectos destacados'
          git push origin HEAD:main
